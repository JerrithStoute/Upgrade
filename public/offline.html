<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <!--
      Shown by the app's worker (sw.js) when a page can't load for lack of signal. No company's name or
      logo on purpose: it's the same for the team, clients and subs — each sees it inside their own app.
    -->
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
      .icon { width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; border-radius: 999px; background: #e2e8f0; display: grid; place-items: center; }
      h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
      p { margin: 0 0 1.5rem; color: #475569; }
      button { font: inherit; font-weight: 600; padding: .75rem 1.5rem; min-height: 48px; border: 0; border-radius: .5rem; background: #0f172a; color: #fff; }
      .waiting { margin-top: 1rem; font-size: .875rem; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.44"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
      </div>
      <h1>You're offline</h1>
      <p>No signal right now. This page will load as soon as your phone is back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <div class="waiting">Waiting for a connection…</div>
    </main>
    <script>
      // Back online: load the page they were going to.
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
